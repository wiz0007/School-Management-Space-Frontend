<section class="final-cta" aria-labelledby="final-title">
  <div>
    <span class="section-label">Ready</span>
    <h2 id="final-title">Make the school day clickable.</h2>
  </div>

  <div class="final-cta__panel">
    <span>Next move</span>
    @if (isAuthenticated) {
      <a class="solid-action solid-action--large" href="/dashboard">Open dashboard</a>
    } @else {
      <div class="final-cta__actions">
        <a class="solid-action solid-action--large" href="/register">Create workspace</a>
        <a class="outline-action" href="/login">Login</a>
      </div>
    }
  </div>
</section>
